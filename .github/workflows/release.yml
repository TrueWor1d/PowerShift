name: Publish releases

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: powershift-release-publication
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      pending: ${{ steps.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify publication recovery
        run: node tests/release_tests.cjs
      - name: Find incomplete publications
        id: plan
        uses: actions/github-script@v7
        with:
          script: |
            const { planReleases } = require('./.github/scripts/releases.cjs');
            await planReleases({ github, context, core, root: process.env.GITHUB_WORKSPACE });

  publish:
    needs: plan
    if: needs.plan.outputs.pending == 'true'
    runs-on: windows-2022
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ matrix.tag }}
      RELEASE_SHA: ${{ matrix.sha }}
      REPLACE_ZIP: ${{ matrix.replace }}
    steps:
      - name: Check out release configuration
        uses: actions/checkout@v4
        with:
          path: publication
      - name: Check publication and ZIP independently
        id: needed
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('path');
            const { checkPublication } = require('./publication/.github/scripts/releases.cjs');
            await checkPublication({ github, context, core,
              root: path.join(process.env.GITHUB_WORKSPACE, 'publication'), tag: process.env.RELEASE_TAG,
              sha: process.env.RELEASE_SHA, replace: process.env.REPLACE_ZIP === 'true' });
      - name: Check out the version being built
        if: steps.needed.outputs.build == 'true'
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ matrix.tag }}
          path: source
      - name: Verify checked-out source
        if: steps.needed.outputs.build == 'true'
        shell: pwsh
        run: |
          $actual = git -C (Join-Path $env:GITHUB_WORKSPACE 'source') rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:RELEASE_SHA) {
              throw 'The version tag changed during publication.'
          }
      - name: Build with MSVC and run Windows integration tests
        if: steps.needed.outputs.build == 'true'
        shell: pwsh
        run: ./source/scripts/build.ps1 -Test
      - name: Verify version, architecture and create ZIP
        if: steps.needed.outputs.build == 'true'
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          $exe = Join-Path $env:GITHUB_WORKSPACE 'source/dist/PowerShift.exe'
          $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          $parts = @($version.Split('.'))
          while ($parts.Count -lt 4) { $parts += '0' }
          if ($info.ProductVersion -ne "V$version" -or $info.FileVersion -ne ($parts -join '.')) {
              throw 'EXE version does not match the tag.'
          }
          $reader = [System.IO.BinaryReader]::new([System.IO.File]::OpenRead($exe))
          try {
              $reader.BaseStream.Position = 0x3c
              $peOffset = $reader.ReadInt32()
              $reader.BaseStream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550 -or $reader.ReadUInt16() -ne 0x8664) {
                  throw 'Expected a Windows x64 executable.'
              }
          } finally { $reader.Dispose() }
          $instructions = Join-Path $env:GITHUB_WORKSPACE 'source/dist/使用说明.txt'
          $zip = Join-Path $env:GITHUB_WORKSPACE "PowerShift-V$version-x64.zip"
          Compress-Archive -LiteralPath $exe, $instructions -DestinationPath $zip
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
              if (!$archive.GetEntry('PowerShift.exe') -or !$archive.GetEntry('使用说明.txt')) {
                  throw 'ZIP does not contain the executable and instructions.'
              }
          } finally { $archive.Dispose() }
          Get-FileHash -LiteralPath $zip -Algorithm SHA256
      - name: Finish publication and clean temporary assets
        if: steps.needed.outputs.publish == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('path');
            const { publishRelease } = require('./publication/.github/scripts/releases.cjs');
            const tag = process.env.RELEASE_TAG;
            const release = await publishRelease({ github, context,
              root: path.join(process.env.GITHUB_WORKSPACE, 'publication'), tag,
              sha: process.env.RELEASE_SHA, replace: process.env.REPLACE_ZIP === 'true',
              zipPath: path.join(process.env.GITHUB_WORKSPACE, `PowerShift-V${tag.slice(1)}-x64.zip`) });
            core.notice(release.html_url);
      - name: Save the release ZIP as a build artifact
        if: steps.needed.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: PowerShift-${{ matrix.tag }}-x64
          path: PowerShift-V*-x64.zip
          if-no-files-found: error

  latest:
    needs: [plan, publish]
    if: always() && needs.plan.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Keep the newest published ZIP as Latest
        uses: actions/github-script@v7
        with:
          script: |
            const { reconcileLatest } = require('./.github/scripts/releases.cjs');
            await reconcileLatest({ github, context });
