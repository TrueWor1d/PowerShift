name: Windows build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build with MSVC and run Windows integration tests
        shell: pwsh
        run: ./scripts/build.ps1 -Test
      - uses: actions/upload-artifact@v4
        with:
          name: PowerShift-V1.0-x64
          path: dist/
